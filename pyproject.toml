[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ace-mixer"
version = "0.1.7"
description = "Mix another singing synthesizer's style curves into an ACE Studio Verse 2.7 track"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.scripts]
ace-mixer = "ace_mixer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ace_mixer"]

[tool.hatch.build.targets.wheel.force-include]
"ace_mixer/chain.py" = "ace_mixer/chain.py"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ace_mixer/chain.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Percent formatting is deliberate for the CLI's progress lines: it keeps each
# format string adjacent to the values it prints. chain.py is vendored.
ignore = ["UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
