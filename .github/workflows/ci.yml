name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv
          uv pip install -e . pytest ruff

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run python -m pytest -q

      - name: Smoke test
        run: |
          uv run ace-mixer --version
          uv run ace-mixer --help

  build:
    name: build exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: pwsh
        run: ./tools/build_exes.ps1 -Python python -OutDir dist

      - name: Smoke test the exe
        shell: pwsh
        run: |
          ./dist/ace-mixer.exe --version
          ./dist/ace-mixer.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: ace-mixer-windows-x64
          path: dist/ace-mixer.exe
          if-no-files-found: error
