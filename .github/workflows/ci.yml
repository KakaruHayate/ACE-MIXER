name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macOS-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv
          uv pip install -e . pytest ruff

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run python -m pytest -q

      - name: Smoke test
        run: |
          uv run ace-mixer --version
          uv run ace-mixer --help

  build:
    name: build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ace-mixer.exe
          - os: macos-latest
            asset: ace-mixer-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build_exes.ps1 -Python python -OutDir dist

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "PyYAML>=6.0" pyinstaller
          common=(
            --onefile --noconfirm --clean --name ace-mixer
            --distpath dist --workpath build/pyi --specpath build/pyi
            --add-data "$PWD/ace_mixer/chain.py:ace_mixer"
            --paths "$PWD"
            --exclude-module pkg_resources --exclude-module setuptools
            --exclude-module distutils --exclude-module plistlib
            --exclude-module xml
          )
          # One file for Intel and Apple silicon when the interpreter allows it.
          pyinstaller --target-arch universal2 "${common[@]}" tools/entry.py \
            || { echo "universal2 unavailable, building for this runner only"; \
                 rm -rf dist build/pyi; \
                 pyinstaller "${common[@]}" tools/entry.py; }
          mv dist/ace-mixer "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dist/ace-mixer.exe --version
          ./dist/ace-mixer.exe --help

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "./dist/${{ matrix.asset }}" --version
          "./dist/${{ matrix.asset }}" --help

      - uses: actions/upload-artifact@v4
        with:
          name: ace-mixer-${{ runner.os }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
