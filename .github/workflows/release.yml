name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: pwsh
        run: ./tools/build_exes.ps1 -Python python -OutDir dist

      - name: Smoke test
        shell: pwsh
        run: |
          ./dist/ace-mixer.exe --version
          ./dist/ace-mixer.exe --help

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/ace-mixer.exe -DestinationPath dist/ace-mixer-windows-x64.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ace-mixer.exe
            dist/ace-mixer-windows-x64.zip
          generate_release_notes: true
