name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with ace_mixer.__version__
        run: |
          python - <<'PY'
          import os, re, sys
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if not ref.startswith("v"):
              print("manual run, skipping")
              sys.exit(0)
          src = open("ace_mixer/__init__.py", encoding="utf-8").read()
          version = re.search(r'__version__ = "([^"]+)"', src).group(1)
          tag = ref.lstrip("v")
          print("tag=%s package=%s" % (tag, version))
          sys.exit(0 if tag == version else 1)
          PY

  build:
    name: build (${{ matrix.os }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ace-mixer.exe
          - os: macos-latest
            asset: ace-mixer-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build_exes.ps1 -Python python -OutDir dist

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "PyYAML>=6.0" pyinstaller
          common=(
            --onefile --noconfirm --clean --name ace-mixer
            --distpath dist --workpath build/pyi --specpath build/pyi
            --add-data "$PWD/ace_mixer/chain.py:ace_mixer"
            --paths "$PWD"
            --exclude-module pkg_resources --exclude-module setuptools
            --exclude-module distutils --exclude-module plistlib
            --exclude-module xml
          )
          pyinstaller --target-arch universal2 "${common[@]}" tools/entry.py \
            || { echo "universal2 unavailable, building for this runner only"; \
                 rm -rf dist build/pyi; \
                 pyinstaller "${common[@]}" tools/entry.py; }
          mv dist/ace-mixer "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dist/ace-mixer.exe --version
          ./dist/ace-mixer.exe --help

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "./dist/${{ matrix.asset }}" --version
          "./dist/${{ matrix.asset }}" --help

      - uses: actions/upload-artifact@v4
        with:
          name: ace-mixer-${{ runner.os }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release
          cp artifacts/ace-mixer-Windows/ace-mixer.exe release/ace-mixer.exe
          cp artifacts/ace-mixer-macOS/ace-mixer-macos release/ace-mixer-macos
          chmod +x release/ace-mixer-macos
          cd skill && zip -r ../release/ace-mixer-skill.zip ace-v27-style-transfer
          cd ..
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ace-mixer.exe
            release/ace-mixer-macos
            release/ace-mixer-skill.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
